# config.example.toml — AgentHandover configuration
# Copy to the OS-appropriate location:
#   macOS:   ~/Library/Application Support/agenthandover/config.toml
#   Linux:   ~/.config/agenthandover/config.toml
# Every key is optional; a missing key keeps the default shown here. Every
# key listed is read by the daemon (crates/common/src/config.rs) or the
# worker (worker/src/agenthandover_worker/config.py); a test keeps it so.

[observer]
capture_screenshots = true
screenshot_max_per_minute = 20  # ceiling on frames kept per minute (passive)
focus_screenshot_max_per_minute = 40  # separate ceiling during a focus recording
screenshot_quality = 70          # JPEG quality 1-100
screenshot_scale = 0.5           # fraction of native (Retina) pixels of the focused window
dhash_threshold = 1              # changed screen blocks needed to keep a frame (higher = fewer frames)

[privacy]
enable_clipboard_preview = false # store the first characters of copied text
clipboard_preview_max_chars = 200
capture_input_values = false     # include <input>/<textarea> values in browser DOM snapshots
read_app_state = false           # read the open document/page/message from Safari, Mail, Notes... via AppleScript; opt in during onboarding (macOS asks per app; apps not granted are skipped, `agenthandover doctor` lists them)

[storage]
retention_days_raw = 14          # raw events older than this are deleted by the daemon's maintenance
retention_days_episodes = 90
vacuum_min_free_gb = 5
vacuum_safety_multiplier = 2.5

[idle_jobs]
# The idle-time gate: passive discovery runs early (instead of every 2
# hours) only inside the window and when all of these hold. Passive annotation has its own lighter rule (AC
# power, a locked screen, or two minutes without input).
require_ac_power = true
min_battery_percent = 50
max_cpu_percent = 30
max_temp_c = 80
run_window_local_time = "01:00-05:00"

[vlm]
job_ttl_days = 7                 # screenshots never annotated are deleted after this many days
# ollama_host = "http://localhost:11434"   # another host: doctor checks only its version, not installs or memory
# Every model runs locally through Ollama (cloud mode was removed in 0.5.0;
# the upgrade turns an old mode = "remote" block local, with a backup).
# --- scene annotation pipeline ---
# Model tiers: the table is TIERS in worker/src/agenthandover_worker/
# model_profiles.py, installed as tiers.json next to this file (copy in
# resources/tiers.json).  Onboarding and `agenthandover setup` write
# `tier`, `annotation_model` and `sop_model`; a missing model key falls
# back to the named tier, else to the tier this Mac's RAM recommends:
#   standard     (8GB):  qwen3.5:2b-q4_K_M annotates, qwen3.5:4b writes
#                        Skills (one model loaded at a time)
#   recommended  (16GB): qwen3.5:4b annotates and writes Skills (it wrote
#                        Skills faster than gemma4:12b-it-qat on a 16 GB Mac)
#   performance  (24GB): qwen3.5:4b annotates, gemma4:12b-it-qat writes Skills
#   max_quality  (48GB): qwen3.5:4b annotates, gemma4:31b-it-qat writes Skills
# The Gemma 4 QAT tags need Ollama 0.34.0+.  Settings per model are
# auto-tuned via model_profiles.py.
tier = "standard"
annotation_model = "qwen3.5:2b-q4_K_M"  # model for per-frame annotation
sop_model = "qwen3.5:4b"                # model for Skill generation and synthesis
# reasoning_model = ""             # the LLM reasoner's model; empty = sop_model
# sop_ab = false                   # max_quality: A/B arm gemma4:26b-a4b-it-qat as sop_model
annotation_enabled = true          # enable continuous scene annotation pipeline
sliding_window_max_age_sec = 600   # 10 min max age for context window
annotation_timeout_seconds = 180   # per annotation call; also bounds the model preload at worker start
annotation_max_frames_per_day = 1500          # passive frames sent to the model per local day (focus exempt)
annotation_max_compute_minutes_per_day = 60   # Ollama prompt + generation minutes per local day (focus exempt)
annotation_max_frames_per_hour = 60           # passive frames sent to the model per rolling hour, cache hits free (focus exempt)
annotation_max_compute_minutes_per_hour = 10  # Ollama minutes of passive model calls (annotation, diffs, discovery) per rolling hour
reasoning_max_calls_per_day = 300             # LLM reasoner + behavioral synthesis calls per local day (cluster labels, links, curation)
reasoning_max_compute_minutes_per_day = 90    # wall-clock minutes of those calls per local day

[embedding]
model = "nomic-embed-text"         # text embeddings, with the model's task prefixes and thresholds
retention_days = 90                # vectors not updated for this long are purged daily
max_rows = 50000                   # hard cap; the least recently updated vectors are evicted

[memory]
enabled = false                    # embed every kept screen into a private, searchable memory
model = "embeddinggemma-2:440m"    # needs Ollama 0.40 or later
dimensions = 256                   # stored vector size
retention_days = 365               # memory rows older than this are deleted
thumbnail_days = 7                 # encrypted thumbnails older than this are deleted
agents_access = false              # let agents search memory over MCP (never images)
max_frames_per_hour = 600          # embedding budget

[focus]
max_session_hours = 4              # a recording never stopped is closed as stale after this long

[llm]
# The SOP text enhancer of the older focus path, used only when
# [vlm] annotation_enabled = false.
enhance_sops = true
max_enhancements_per_day = 20
# model = ""                   # empty = [vlm] sop_model
# timeout_seconds = 60
# temperature = 0.3
# max_tokens = 800

[openclaw]
workspace_path = "~/.openclaw/workspace"   # where `agenthandover connect openclaw` looks for the workspace

[sop]
# When false (default), generated Skills are saved as drafts for review in
# the app. Set to true to mark the draft record approved without review.
# Either way, nothing is written where agents read (Skills, SOP files, the
# MCP server's ready list) until you "Approve for agents" in the app.
auto_approve = false

[export]
adapter = "openclaw"           # "openclaw", "generic", "skill-md", "claude-skill" or "all" (a pkg install writes "all")
# claude_skills_dir = "~/.claude/skills"   # where Claude Code skills are written

[knowledge]
# The local HTTP query API for agents (loopback only; POSTs need the token).
query_api_enabled = true
query_api_port = 9477
# Questions AgentHandover may ask you in any seven days (after a focus
# recording, and as review cards about what it could not learn); 0 = none.
weekly_question_budget = 5

[privacy.zones]
# Enforced by the daemon before it captures a frame, and again by the worker
# on stored events. App patterns match the app name and the window title;
# URL patterns match the browser's current page (origin + path). Globs,
# case-insensitive. Password managers, macOS password and permission
# prompts, and banking/payroll/login URLs are always blocked in addition
# to these lists.
# Apps that are always observed at full fidelity
# full_observation = ["Safari", "Google Chrome"]
# Apps where only metadata (app name, timestamp) is captured — no screenshots
# metadata_only = ["Messages"]
# Apps that are completely blocked from observation (glob patterns)
# blocked = ["Signal*", "WhatsApp*"]
# URL patterns that are always blocked (glob patterns, case-insensitive)
# blocked_urls = ["*health*", "*.internal/*"]
# Time windows during which all observation is paused (HH:MM-HH:MM, local time)
# auto_pause = ["12:00-13:00"]

[features]
# Pipeline stages that can be switched off. All default to true.
activity_classification = true     # 8-class work/noise taxonomy of annotated frames
continuity_tracking = true         # task continuity across interruptions
lifecycle_management = true        # the daily lifecycle pass (automatic transitions, e.g. to stale)
curation = true                    # curation queue: merges and drift
runtime_validation = true          # preflight: are a Skill's apps running (pgrep)
