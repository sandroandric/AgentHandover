# A config as the installer leaves it, plus a hand-set [vlm] key, a stale
# model key and a following section: onboarding and `agenthandover setup`
# must turn it into performance.toml byte for byte.

[export]
adapter = "all"
json_export = false

[vlm]
mode = "local"
tier = "performance"
annotation_model = "qwen3.5:4b"
sop_model = "gemma4:12b-it-qat"
ollama_host = "http://localhost:11434"
annotation_timeout_seconds = 240

[embedding]
model = "nomic-embed-text"
image_embeddings = false
